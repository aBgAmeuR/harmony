name: Release

on:
  push:
    branches: [v3]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-v3
  cancel-in-progress: false

jobs:
  lint:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - name: Run verify
        run: pnpm verify

  release:
    name: Semantic release
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & push · ${{ matrix.app.name }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: api
            dockerfile: apps/server/Dockerfile
            title: Harmony API
            description: Rust Axum upload API and Spotify history ingestion pipeline for Harmony
          - name: web
            dockerfile: apps/web/Dockerfile
            title: Harmony Web
            description: TanStack Start frontend for Harmony Spotify analytics
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/abgameur/harmony/${{ matrix.app.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }},priority=900
            type=raw,value=latest,priority=100
          labels: |
            org.opencontainers.image.title=${{ matrix.app.title }}
            org.opencontainers.image.description=${{ matrix.app.description }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          build-args: |
            VITE_APP_VERSION=${{ needs.release.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  pin-compose:
    name: Pin compose image tags
    needs: [release, build]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin image versions in docker-compose.yml
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          sed -i "s|ghcr.io/abgameur/harmony/web:[^[:space:]]*|ghcr.io/abgameur/harmony/web:${TAG}|" docker-compose.yml
          sed -i "s|ghcr.io/abgameur/harmony/api:[^[:space:]]*|ghcr.io/abgameur/harmony/api:${TAG}|" docker-compose.yml

      - name: Commit and push pinned compose
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --staged --quiet; then
            echo "Compose already pinned to ${{ needs.release.outputs.tag }}"
            exit 0
          fi
          git commit -m "deploy: pin images to ${{ needs.release.outputs.tag }} [skip ci]"
          git push
