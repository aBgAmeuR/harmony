name: Release

on:
  push:
    branches: [v3]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    name: Build & push · ${{ matrix.app.name }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: api
            dockerfile: docker/api.Dockerfile
            build_args: ''
          - name: web
            dockerfile: docker/web.Dockerfile
            build_args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate web release environment
        if: matrix.app.name == 'web'
        run: test -n "${{ vars.VITE_API_URL }}"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          build-args: ${{ matrix.app.build_args }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.app.name }}:${{ github.sha }}
