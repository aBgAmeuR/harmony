name: Release

on:
  push:
    branches: [v3]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-v3
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & push · ${{ matrix.app.name }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: api
            dockerfile: apps/server/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/abgameur/harmony/${{ matrix.app.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }},priority=900
            type=raw,value=latest,priority=100

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          build-args: |
            VITE_APP_VERSION=${{ needs.release.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/abgameur/harmony/${{ matrix.app.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/abgameur/harmony/${{ matrix.app.name }}:buildcache,mode=max

  pin-compose:
    name: Pin compose image tags
    needs: [release, build]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin image versions in docker-compose.yml
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          sed -i "s|ghcr.io/abgameur/harmony/web:[^[:space:]]*|ghcr.io/abgameur/harmony/web:${TAG}|" docker-compose.yml
          sed -i "s|ghcr.io/abgameur/harmony/api:[^[:space:]]*|ghcr.io/abgameur/harmony/api:${TAG}|" docker-compose.yml

      - name: Commit and push pinned compose
        env:
          TAG: ${{ needs.release.outputs.tag }}
          COAUTHOR_NAME: ${{ github.actor }}
          COAUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --staged --quiet; then
            echo "Compose already pinned to ${TAG}"
            exit 0
          fi
          git commit -m "$(cat <<EOF
          deploy: pin images to ${TAG}

          [skip ci]

          Co-authored-by: ${COAUTHOR_NAME} <${COAUTHOR_EMAIL}>
          EOF
          )"
          git push
