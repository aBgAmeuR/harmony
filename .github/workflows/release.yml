name: Release

on:
  push:
    branches: [v3]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-v3
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & push image
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute major tag
        id: major
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: echo "tag=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/abgameur/harmony
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }},priority=900
            type=raw,value=${{ steps.major.outputs.tag }},priority=200
            type=raw,value=latest,priority=100

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            HARMONY_VERSION=${{ needs.release.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/abgameur/harmony:buildcache
          cache-to: type=registry,ref=ghcr.io/abgameur/harmony:buildcache,mode=max

  release-assets:
    name: Attach self-hosting files
    needs: [release, build]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pin default image version
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: sed -i "s|\${HARMONY_VERSION:-latest}|\${HARMONY_VERSION:-${TAG}}|" docker/docker-compose.yml

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" docker/docker-compose.yml docker/example.env --clobber
