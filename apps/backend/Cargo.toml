[package]
name = "harmony-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
axum-tracing-opentelemetry = "0.33.1"
init-tracing-opentelemetry = { version="0.37.0", features = [
  "otlp",
  "tracing_subscriber_ext",
  "metrics"
] }
diesel = { version = "2.2.0", features = ["postgres", "chrono", "r2d2"] }
pq-sys = { version = "*", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tracing-opentelemetry = "0.32.1"
dotenvy = "0.15"
tracing = "0.1"
serde = "1.0"
serde_json = "1.0"
rand = "0.9"
zip = "8.6"
regex = "1.12"
