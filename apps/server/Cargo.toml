[workspace]
resolver = "2"
members = ["crates/adapters", "crates/domain", "crates/http", "crates/pipeline", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["aBgAmeuR"]
license = "GPL-3.0-only"
repository = "https://github.com/abgameur/harmony"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.51", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling (anyhow + thiserror)
thiserror = "2.0"
anyhow = "1.0"

# Tracing (used by server logging, CLI, TUI, and WASM frontends)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment variables
dotenvy = "0.15"

# Web framework (Axum)
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }

# Date and time
chrono = { version = "0.4.44", features = ["serde"] }

# Pipeline / upload
dashmap = "6"
rand = "0.9"
zip = "8.6"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
strsim = "0.11"
futures = "0.3"
tempfile = "3"
duckdb = { version = "1.2", default-features = false }

# Object storage (S3-compatible / Cloudflare R2, SigV4 over reqwest)
hmac = "0.12"
sha2 = "0.10"

# OpenTelemetry
opentelemetry = "0.31"
tracing-opentelemetry = "0.32.1"
axum-tracing-opentelemetry = "0.33.1"
init-tracing-opentelemetry = { version = "0.43.0", features = [
  "otlp",
  "tracing_subscriber_ext",
  "metrics",
  "logs",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
