name: harmony

services:
  harmony:
    image: ghcr.io/abgameur/harmony:${HARMONY_VERSION:-latest}
    ports:
      - "${HARMONY_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - harmony-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  harmony-data:
